<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدرسة أيلمان – الحضور وكشف الدرجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F9F9; --soft:#EDF2F2; --surface:#FEFFFF; --ink:#2B3A3F; --muted:#63757B; --line:#DCE5E6;
  --sky:#33707F; --sky-soft:#E1EEF0; --green:#2E7D4F; --green-soft:#E3F1E8;
  --red:#B5474C; --red-soft:#F8E6E6; --amber:#8F6A1E; --amber-soft:#F6EDD8; --slate-soft:#E8EEEF;
  --banner:#3A7483; --banner-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1F21; --soft:#242B2E; --surface:#20272A; --ink:#DDE5E6; --muted:#98A8AC; --line:#344044;
    --sky:#8CC3CF; --sky-soft:#23393F; --green:#7CC79A; --green-soft:#24392D;
    --red:#E08A8E; --red-soft:#462A2C; --amber:#D9B878; --amber-soft:#3D331F; --slate-soft:#2A3336;
    --banner:#27505B; --banner-ink:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1F21; --soft:#242B2E; --surface:#20272A; --ink:#DDE5E6; --muted:#98A8AC; --line:#344044;
    --sky:#8CC3CF; --sky-soft:#23393F; --green:#7CC79A; --green-soft:#24392D;
    --red:#E08A8E; --red-soft:#462A2C; --amber:#D9B878; --amber-soft:#3D331F; --slate-soft:#2A3336;
    --banner:#27505B; --banner-ink:#FFFFFF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.top{background:var(--banner);color:var(--banner-ink)}
.top :focus-visible{outline-color:#fff}
.themebtn{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:99px;width:42px;height:42px;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.themebtn svg{box-shadow:none;border-radius:0}
.top-in{max-width:1080px;margin:0 auto;padding:18px 16px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top svg{flex:none;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.top h1{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:1.75rem;line-height:1.2;margin:0;font-weight:700}
.top p{margin:2px 0 0;color:rgba(255,255,255,.85);font-size:.9rem}
.top .grow{flex:1;min-width:200px}
.addr{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:4px 14px 4px 12px;border-radius:99px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:.88rem;text-decoration:none;line-height:1.6}
.addr svg{box-shadow:none;border-radius:0;flex:none;opacity:.9}
.addr b{display:none;font-weight:600;border-inline-start:1px solid rgba(255,255,255,.4);padding-inline-start:9px;margin-inline-start:2px}
.addr[href] b{display:inline}
.addr[href]:hover{background:rgba(255,255,255,.26)}
#sync{font-size:.82rem;color:#fff;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 12px}

#tabs{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:10px 16px 0}
#tabs button{flex:none;border:0;background:none;padding:9px 14px;border-bottom:3px solid transparent;color:rgba(255,255,255,.78);font-weight:500;cursor:pointer;white-space:nowrap}
#tabs button[aria-current="page"]{color:#fff;border-bottom-color:#fff;font-weight:700}

#banner{max-width:1080px;margin:10px auto 0;padding:0 16px}
#banner div{background:var(--sky-soft);color:var(--sky);margin-bottom:6px;border-radius:8px;padding:8px 14px;font-size:.9rem}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
h2{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:1.3rem;margin:0 0 6px;font-weight:700}
h3{font-size:1.02rem;margin:26px 0 8px}
.lead{font-size:1.08rem;margin:0 0 16px;max-width:60ch}
.muted{color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center}
.empty p{margin:0 0 14px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;border-inline-end:1px solid var(--line)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed="true"]{background:var(--sky);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0E2228}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0E2228}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--sky);border-color:var(--sky);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0E2228}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0E2228}}
.btn.sm{padding:3px 9px;font-size:.82rem}
.btn.danger{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=date],input[type=number],input[type=url],input[type=time],input[type=password],textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:110px}
label.f{display:inline-flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:2px}

.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:.86rem;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
td.idx{color:var(--muted);width:2.2em;text-align:center;font-variant-numeric:tabular-nums}

/* دفتر الحضور */
.reg th.day{text-align:center;min-width:74px;padding:8px 4px}
.reg th.day b{display:block;color:var(--ink);font-size:.95rem}
.reg th.day small{display:block;font-weight:400}
.reg th.today{background:var(--sky-soft)}
.reg td.c{text-align:center;padding:5px 4px}
.cell{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-weight:700;font-size:1rem;line-height:1}
.cell.P{background:var(--green-soft);border-color:transparent;color:var(--green)}
.cell.A{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.cell.L{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.cell.E{background:var(--slate-soft);border-color:var(--muted);color:var(--ink)}
.cell:disabled{opacity:.35;cursor:not-allowed}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted);margin:10px 2px}
.legend i{font-style:normal;font-weight:700;display:inline-block;width:1.6em;height:1.6em;line-height:1.6em;text-align:center;border-radius:6px;margin-inline-end:5px}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.84rem;font-weight:600}
.tag.ok{background:var(--green-soft);color:var(--green)} .tag.no{background:var(--amber-soft);color:var(--amber)} .tag.bad{background:var(--red-soft);color:var(--red)}

.marks input{width:4.4em;text-align:center;direction:ltr;padding:6px 4px}
.marks td.tot{font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.rowedit{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line)}
.rowedit:last-child{border-bottom:0}
.rowedit input[type=text]{flex:1;min-width:150px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:12px}
/* الترويسة: الغلاف والشعار */
.cover{background:#FCF6E6;border-bottom:3px solid #C9A24A;color:#22323A}
.cover :focus-visible{outline-color:#1F3F7A}
.cover-in{max-width:1080px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:flex-end;gap:16px}
.logo{flex:none;align-self:center;border:0;background:none;padding:0;cursor:zoom-in;border-radius:50%;margin-bottom:14px}
.logo img{display:block;width:104px;height:104px;border-radius:50%;box-shadow:0 3px 12px rgba(31,63,122,.28)}
.cover .grow{flex:1;min-width:0;align-self:center;padding-bottom:14px}
.cover h1{color:#1F3F7A}
.callig{display:block;height:58px;max-width:100%}
.cover p{margin:2px 0 0;color:#4A5A60;font-size:.95rem}
.kids{flex:none;height:168px;border:0;background:none;padding:0;cursor:zoom-in}
.kids img{height:100%;display:block}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.cover .addr{margin-top:0;background:#2F6877;border-color:#2F6877}
.cover .addr[href]:hover{background:#27505B}
.cover #sync{background:rgba(47,104,119,.13);color:#2B5B67}
.navrow{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-inline-end:16px}
.navrow #tabs{flex:1;min-width:0;margin:0}
.navrow .themebtn{flex:none;width:36px;height:36px}
#lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,20,25,.84);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lightbox[hidden]{display:none}
#lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
@media (max-width:640px){.logo img{width:68px;height:68px}.kids{height:104px}.callig{height:40px}.cover-in{gap:10px}.cover p{font-size:.82rem}}
@media (max-width:420px){.kids{display:none}}

/* شاشة القفل */
.lock{max-width:380px;margin:36px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
.lock svg{color:var(--sky)}
.lock h2{margin:8px 0 4px}
.lock p{margin:0 0 16px;color:var(--muted)}
.lock input{width:100%;text-align:center;font-size:1.1rem;padding:10px;margin-bottom:12px}
.lock .btn{width:100%;padding:10px}

/* الجدول الأسبوعي */
.tt th.day{text-align:center;min-width:96px}
.tt th.day.today,.tt td.today{background:var(--sky-soft)}
.tt td.per{white-space:nowrap;width:1%}
.tt td.per b{display:block}.tt td.per small{color:var(--muted);direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
.tt td.c{padding:5px;text-align:center}
.tt tr.brk td{background:var(--soft);text-align:center;color:var(--muted);font-weight:600;padding:6px;letter-spacing:.02em}
.sub{display:block;border-radius:9px;padding:9px 6px;font-weight:600;font-size:.93rem;line-height:1.35;background:hsl(var(--h) 42% 90%);color:hsl(var(--h) 45% 25%)}
.sub.none{background:none;color:var(--muted);font-weight:400;border:1px dashed var(--line)}
:root[data-theme="dark"] .sub:not(.none){background:hsl(var(--h) 26% 25%);color:hsl(var(--h) 48% 84%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sub:not(.none){background:hsl(var(--h) 26% 25%);color:hsl(var(--h) 48% 84%)}}
.tt select{width:100%;min-width:90px;padding:7px 4px}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.counts .sub{display:inline-block;padding:4px 12px}
.printonly{display:none}
#toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:9}
#toast span{background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px;font-size:.92rem;opacity:0;transition:opacity .2s}
#toast span.on{opacity:1}
.paperwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  :root{padding:0} body{background:#fff}
  .top,#tabs,#banner,#toast,#lightbox,.noprint{display:none!important}
  .printonly{display:block}
  main{padding:0;max-width:none} .paperwrap{border:0;padding:0;overflow:visible}
}
</style>
<style id="sheetcss"></style>
</head>
<body>
<header class="top">
<div class="cover"><div class="cover-in">
  <button class="logo" data-act="cover" aria-label="عرض غلاف المدرسة كاملاً"><img data-img="logo" alt="شعار مدرسة أيلمان الابتدائية" width="104" height="104"></button>
  <div class="grow"><h1 id="sname">مدرسة أيلمان</h1><p>سجل الحضور والغياب وكشف الدرجات</p>

    <span id="sync" role="status">جارٍ التحميل…</span></div></div>
  <button class="kids" data-act="cover" aria-label="عرض غلاف المدرسة كاملاً"><img data-img="kids" alt=""></button>
</div></div>
<div class="navrow"><nav id="tabs" aria-label="أقسام النظام"></nav><button class="themebtn" id="themebtn" data-act="theme"></button></div>
</header>
<div id="lightbox" data-act="coverclose" hidden><img data-img="cover" alt="غلاف تطبيق مدرسة أيلمان"></div>
<div id="banner"></div>
<main id="view"></main>
<div id="toast"><span></span></div>

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const sunday=d=>addDays(d,-d.getDay());
const LOC='ar-EG-u-nu-latn';

const f1=v=>v==null?'—':String(Math.round(v*10)/10);
const uid=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const gw=v=>v==null?'—':v>=90?'ممتاز':v>=80?'جيد جداً':v>=65?'جيد':v>=50?'مقبول':'ضعيف';
const gwm=(v,mx)=>gw(v==null?null:v/mx*100);
/* كتابة الدرجة بالحروف */
const W1=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const W10=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],W100=['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];
function w999(n){const p=[],hd=Math.floor(n/100),r=n%100;if(hd)p.push(W100[hd]);if(r){if(r<20)p.push(W1[r]);else{const o=r%10,t=Math.floor(r/10);p.push(o?W1[o]+' و'+W10[t]:W10[t])}}return p.join(' و')}
function words(v){
  if(v==null)return'—';const x=Math.round(v*2)/2,i=Math.floor(x),half=x-i>0;let s='';
  if(i){const th=Math.floor(i/1000),r=i%1000,p=[];if(th)p.push(th===1?'ألف':th===2?'ألفان':w999(th)+(th<=10?' آلاف':' ألفاً'));if(r)p.push(w999(r));s=p.join(' و')}
  return half?(s?s+' ونصف':'نصف'):(s||'صفر');
}
let toastT;
function toast(msg){const s=$('#toast span');s.textContent=msg;s.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>s.classList.remove('on'),2600)}
function confirm2(btn,fn){
  if(btn.dataset.armed){delete btn.dataset.armed;fn();return}
  const t=btn.textContent;btn.dataset.armed='1';btn.textContent='اضغط مرة ثانية للتأكيد';btn.classList.add('danger');
  setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=t;btn.classList.remove('danger')}},3500);
}

/* ---------- التخزين ---------- */
const Store={
  db:null,pending:{},busy:{},
  async init(){
    let db=null,user=null;
    try{if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}}catch(e){}
    this.db=db;S.local=!db;
    try{if(user&&(await user.can('data.write'))===false)S.canWrite=false}catch(e){}
  },
  async get(key){
    if(this.db){const s=await this.db.doc(key).get();return s.exists?clone(s.data()):null}
    try{const v=localStorage.getItem('aylman:'+key);return v?JSON.parse(v):null}catch(e){return null}
  },
  set(key,obj){this.pending[key]=clone(obj);if(!this.busy[key])this.flush(key)},
  async flush(key){
    this.busy[key]=true;setSync('جارٍ الحفظ…');
    while(key in this.pending){
      const o=this.pending[key];delete this.pending[key];
      try{
        if(this.db)await this.db.doc(key).set(o);
        else localStorage.setItem('aylman:'+key,JSON.stringify(o));
      }catch(e){this.fail(e)}
    }
    this.busy[key]=false;
    if(!Object.values(this.busy).some(Boolean))setSync();
  },
  fail(e){
    const c=e&&e.code;
    if(c==='invalid_argument'||c==='not_granted'||c==='revoked'){S.canWrite=false;drawBanner();toast('لم يُحفظ التعديل: صلاحيتك للعرض فقط')}
    else if(c==='quota_exceeded')toast('امتلأت مساحة التخزين. احذف بيانات قديمة ثم حاول');
    else toast('تعذّر الحفظ. تحقق من الاتصال وأعد المحاولة');
  },
  async put(key,o){if(this.db)await this.db.doc(key).set(o);else localStorage.setItem('aylman:'+key,JSON.stringify(o))},
  async list(coll){
    if(this.db){const q=await this.db.collection(coll).limit(1000).get();return q.docs.map(d=>coll+'/'+d.id)}
    const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('aylman:'+coll+'/'))out.push(k.slice(7))}}catch(e){}return out;
  },
  async del(key){
    try{if(this.db)await this.db.doc(key).delete();else localStorage.removeItem('aylman:'+key)}catch(e){this.fail(e)}
  }
};
function setSync(t){$('#sync').textContent=t||(S.local?'✓ بياناتك محفوظة على هذا الجهاز':'✓ تم حفظ جميع البيانات')}
const ttKey=c=>`timetable/${c}`;
const attKey=(c,ym)=>`att/${c}_${ym}`, gKey=(c,t)=>`grades/${c}_t${t}`;
async function loadDoc(key,force){
  if(!force&&S.docs[key])return S.docs[key];
  const d=(await Store.get(key))||{};
  if(key.startsWith('att/')){if(!d.d||typeof d.d!=='object')d.d={};
    for(const day of Object.values(d.d))if(day)for(const [sid,st] of Object.entries(day)){if(st==='E')day[sid]='A';else if(st!=='A')delete day[sid]}
  }else if(key.startsWith('timetable/')){if(!d.g||typeof d.g!=='object')d.g={}}
  else{if(!d.m||typeof d.m!=='object')d.m={};
    for(const st of Object.values(d.m))if(st)for(const k of Object.keys(st)){const a=Array.isArray(st[k])?st[k]:[];st[k]=MAX.map((mx,j)=>a[j]==null?null:Math.min(mx,Math.max(0,Number(a[j])||0)))}
  }
  return S.docs[key]=d;
}

/* ---------- حسابات ---------- */
function monthsBetween(a,b){const out=[];let d=parse(a.slice(0,7)+'-01');const e=parse(b);while(d<=e){out.push(iso(d).slice(0,7));d=new Date(d.getFullYear(),d.getMonth()+1,1)}return out}
async function termAtt(cid,ti){
  const T=S.cfg.terms[ti],per={};let taken=0;
  const docs=await Promise.all(monthsBetween(T.from,T.to).map(m=>loadDoc(attKey(cid,m))));
  for(const doc of docs)for(const [d,day] of Object.entries(doc.d)){
    if(d<T.from||d>T.to||!day)continue;taken++;
    for(const [sid,st] of Object.entries(day)){const p=per[sid]||(per[sid]={A:0,L:0,E:0});if(st in p)p[st]++}
  }
  return{taken,per};
}
function subjTotal(gdoc,sid,sub){let a=gdoc.m[sid]&&gdoc.m[sid][sub];if(!a)return null;a=a.slice(0,MAX.length);if(!a.some(v=>v!=null))return null;return a.reduce((x,v)=>x+(Number(v)||0),0)}
async function classResults(cid,termSel){
  const terms=termSel==='y'?[1,2]:[Number(termSel)],mx=termSel==='y'?TERM_MAX*2:TERM_MAX;
  const gd=await Promise.all(terms.map(t=>loadDoc(gKey(cid,t))));
  const rows=inClass(cid).map(st=>{
    const vals={},byTerm={};let sum=0,n=0,fail=false,partial=false;
    for(const sb of S.cfg.subjects){
      const ts=gd.map(g=>subjTotal(g,st.id,sb.id));byTerm[sb.id]=ts;
      const have=ts.filter(v=>v!=null);
      const v=have.length?have.reduce((a,b)=>a+b,0):null;
      if(have.length&&have.length<ts.length)partial=true;
      vals[sb.id]=v;if(v!=null){sum+=v;n++;if(v<mx/2)fail=true}
    }
    if(partial)fail=false;
    return{st,vals,byTerm,sum,n,avg:n?sum/(n*mx)*100:null,fail,partial,rank:null};
  });
  const ranked=rows.filter(r=>r.avg!=null).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>{r.rank=i&&Math.abs(ranked[i-1].avg-r.avg)<1e-9?ranked[i-1].rank:i+1});
  return{rows,gd,terms,mx,count:ranked.length};
}

/* مساعدات الجدول */
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'],HUES=[200,150,35,275,340,95,18,245,175,310];
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'];
function periodLabels(){let n=0;return S.cfg.periods.map(p=>p.br?'الاستراحة':'الحصة '+(ORD[n++]||n))}
const tm=t=>{const [a,b]=String(t||'').split(':');return a?Number(a)+':'+(b||'00'):'—'};
const subIdx=id=>S.cfg.subjects.findIndex(s=>s.id===id);
const subChip=i=>`<span class="sub" style="--h:${HUES[i%HUES.length]}">${esc(S.cfg.subjects[i].name)}</span>`;
function sheetTT(c,doc){
  const P=S.cfg.periods,L=periodLabels();
  const th=P.map((p,i)=>p.br?`<th class="brk">&nbsp;</th>`:`<th>${L[i]}<small>${tm(p.from)} – ${tm(p.to)}</small></th>`).join('');
  const body=DAYS.map((n,d)=>`<tr><th>${n}</th>${P.map(p=>{if(p.br)return d?'':`<td class="brk" rowspan="${DAYS.length}"><span style="writing-mode:vertical-rl">استراحة</span></td>`;const si=subIdx(doc.g[d+'_'+p.id]);return`<td class="tc">${si>=0?esc(S.cfg.subjects[si].name):''}</td>`}).join('')}</tr>`).join('');
  return`<section class="sheet wide">${sheetHead('الجدول الأسبوعي، '+esc(c.name))}
  <div class="sh-info"><div><b>الصف</b>${esc(c.name)}</div><div><b>معلم الفصل</b>${esc(c.teacher||'—')}</div></div>
  <table><thead><tr><th>اليوم</th>${th}</tr></thead><tbody>${body}</tbody></table>
  ${signs(c,false)}</section>`;
}
function ttDoc(){const key=ttKey(S.classId);return[key,S.docs[key]||(S.docs[key]={g:{}})]}

/* خانات الحضور */
function dayOf(k){const doc=S.docs[attKey(S.classId,k.slice(0,7))];return doc?doc.d[k]:undefined}
function dayHead(k){
  const d=parse(k),day=dayOf(k),future=k>iso(new Date()),n=inClass(S.classId).length;
  let b;
  if(future)b='<small>لم يحن</small>';
  else if(!day)b=`<button class="btn sm pri" data-act="dayall" data-d="${k}">الكل حاضر</button>`;
  else{const ab=inClass(S.classId).filter(s=>day[s.id]==='A').length;b=`<small>حضر ${n-ab} من ${n}</small><button class="btn sm" data-act="dayclear" data-d="${k}">إلغاء</button>`}
  return`<b>${fWeekday.format(d)}</b><small>${d.getDate()}/${d.getMonth()+1}</small>${b}`;
}
function cellBtn(s,k,today){
  const day=dayOf(k),st=day?(day[s.id]||'P'):'';
  return`<button class="cell ${st}" data-act="cell" data-s="${s.id}" data-d="${k}" ${k>today?'disabled':''} aria-label="${esc(s.name)}، ${fWeekday.format(parse(k))}: ${st?ST[st][1]:'لم يُسجَّل'}">${st?ST[st][0]:'·'}</button>`;
}
function attDoc(k){const key=attKey(S.classId,k.slice(0,7));const doc=S.docs[key]||(S.docs[key]={d:{}});return[key,doc]}

/* الكشوف */
async function attFor(cid,termSel){
  const ts=termSel==='y'?[0,1]:[Number(termSel)-1];const rs=await Promise.all(ts.map(t=>termAtt(cid,t)));
  const out={taken:0,per:{}};
  for(const r of rs){out.taken+=r.taken;for(const [sid,p] of Object.entries(r.per)){const o=out.per[sid]||(out.per[sid]={A:0,L:0,E:0});o.A+=p.A;o.L+=p.L;o.E+=p.E}}
  return out;
}

/* استيراد Excel */
const norm=s=>String(s??'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLowerCase();
function matchClass(v){
  const t=norm(v);if(!t)return null;const C=S.cfg.classes;
  for(const c of C)if(norm(c.name)===t)return c.id;
  const dg=t.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).match(/\d+/);
  if(dg)return C[Number(dg[0])-1]?C[Number(dg[0])-1].id:null;
  const ord=['اول','ثاني','ثالث','رابع','خامس','سادس'];
  for(let i=0;i<ord.length;i++)if(t.includes(ord[i]))return C[i]?C[i].id:null;
  return null;
}
function parseRows(rows,file){
  let hr=-1,nc=-1,cc=-1;
  for(let r=0;r<Math.min(rows.length,6)&&hr<0;r++){
    const cells=(rows[r]||[]).map(norm);
    const i=cells.findIndex(x=>/اسم|name/.test(x)&&x.length<30);
    if(i>=0){hr=r;nc=i;cc=cells.findIndex((x,j)=>j!==i&&/صف|فصل|class|grade/.test(x))}
  }
  if(hr<0){ // بلا عناوين: أول عمود فيه نص
    const w=Math.max(0,...rows.map(r=>r.length));
    for(let j=0;j<w&&nc<0;j++)if(rows.filter(r=>/[^\d\s.]/.test(String(r[j]??''))).length>=rows.length/2)nc=j;
  }
  const out={file,rows:[],dup:0,noClass:0,per:{}},seen=new Set(S.students.map(s=>s.c+'|'+norm(s.name)));
  if(nc<0)return out;
  for(let r=hr+1;r<rows.length;r++){
    const name=String(rows[r][nc]??'').trim().replace(/\s+/g,' ');
    if(!name||!/[^\d\s.]/.test(name))continue;
    let c=cc>=0?matchClass(rows[r][cc]):null;
    if(!c){c=S.classId;if(cc>=0&&norm(rows[r][cc]))out.noClass++}
    const k=c+'|'+norm(name);if(seen.has(k)){out.dup++;continue}seen.add(k);
    out.rows.push({name:name.slice(0,80),c});out.per[c]=(out.per[c]||0)+1;
  }
  return out;
}

  const G=['فاطمة','عائشة','مريم','خديجة','زينب','حليمة','آمنة','أسماء','نعيمة','سعاد','هدى','سمية','صفية','رقية'];
  const F=['محمد','أحمد','عبد الله','عمر','علي','حسن','إبراهيم','يوسف','إسماعيل','موسى','عثمان','آدم','جامع','عبدي','روبله','جيله','ورسمه','ديني','فارح','هاشم'];
  let seed=20261007;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const pick=a=>a[Math.floor(rnd()*a.length)];

  const list=[],used=new Set();

  S.students=list;saveStudents();saveCfg();
  const days=[];let d=new Date();while(days.length<15){if(d.getDay()<=4)days.push(iso(d));d=addDays(d,-1)}
  const today=iso(new Date()),ti=today>=S.cfg.terms[1].from?2:1;

    S.docs[gKey(c.id,ti)]=g;Store.set(gKey(c.id,ti),g);
    const byM={};
    days.forEach(k=>{const day={};st.forEach(s=>{const r=rnd();if(r<.06)day[s.id]='A'});
      const key=attKey(c.id,k.slice(0,7));(byM[key]||(byM[key]={d:{}})).d[k]=day});
    for(const [key,doc] of Object.entries(byM)){S.docs[key]=doc;Store.set(key,doc)}
  }
  toast('حُمّلت البيانات التجريبية');S.tab='today';render();
}

async function hashPw(pw,salt){
  const t=salt+'|'+pw;
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
  return'f'+(a>>>0).toString(16)+(b>>>0).toString(16);
}

  dayall(b){if(!guard())return;const k=b.dataset.d,[key,doc]=attDoc(k);doc.d[k]={};Store.set(key,doc);render()},
  dayclear(b){if(!guard())return;confirm2(b,()=>{const k=b.dataset.d,[key,doc]=attDoc(k);delete doc.d[k];Store.set(key,doc);render()})},
  cell(b){
    if(!guard())return;const k=b.dataset.d,sid=b.dataset.s,[key,doc]=attDoc(k);
    if(!doc.d[k]){doc.d[k]={[sid]:'A'};Store.set(key,doc);render();return}
    const cur=doc.d[k][sid]||'P',nx=CYCLE[(CYCLE.indexOf(cur)+1)%CYCLE.length];
    if(nx==='P')delete doc.d[k][sid];else doc.d[k][sid]=nx;
    Store.set(key,doc);
    const s=S.students.find(x=>x.id===sid);b.className='cell '+nx;b.textContent=ST[nx][0];
    b.setAttribute('aria-label',`${s?s.name:''}، ${fWeekday.format(parse(k))}: ${ST[nx][1]}`);
    const h=document.getElementById('dh-'+k);if(h)h.innerHTML=dayHead(k);
  },
  print(){try{window.print()}catch(e){toast('الطباعة غير متاحة هنا. نزّل الملف ثم اطبعه')}},
  dl(){const p=$('#paper');if(!p)return;const c=cls(S.classId);
    if(S.repMode==='class')download(`كشف درجات ${c.name} - ${termName(S.repTerm)}`,p.innerHTML,true);
    else{const s=S.students.find(x=>x.id===S.repStu);download(`شهادة ${s?s.name:''} - ${termName(S.repTerm)}`,p.innerHTML,false)}},
  async dlall(){const R=await classResults(S.classId,S.repTerm),att=await attFor(S.classId,S.repTerm);
    download(`شهادات ${cls(S.classId).name} - ${termName(S.repTerm)}`,R.rows.map(r=>sheetStudent(R,r,att)).join(''),false)},
  async addone(){
    if(!guard())return;const i=$('#onename'),n=i.value.trim().replace(/\s+/g,' ');
    if(!n){toast('اكتب اسم الطالب أولاً');i.focus();return}
    if(S.students.some(s=>s.c===S.classId&&norm(s.name)===norm(n))){toast('هذا الاسم موجود في الفصل نفسه');i.focus();return}
    S.students.push({id:uid(),name:n.slice(0,80),c:S.classId});saveStudents();toast(`أُضيف ${n} إلى ${cls(S.classId).name}`);
    await render();const j=$('#onename');if(j)j.focus();
  },
  impok(){
    if(!guard())return;const n=S.imp.rows.length;
    S.imp.rows.forEach(r=>S.students.push({id:uid(),name:r.name,c:r.c}));S.imp=null;saveStudents();toast(`استُورد ${n} طالباً`);render();
  },
  impno(){S.imp=null;render()},
  tpl(){
    if(!window.XLSX){toast('تعذّر تحميل قارئ Excel. تحقق من الاتصال');return}
    const ws=XLSX.utils.aoa_to_sheet([['الاسم','الصف'],['اكتب اسم الطالب هنا',S.cfg.classes[0].name]]);ws['!cols']=[{wch:34},{wch:18}];
    const wb=XLSX.utils.book_new();if(!wb.Workbook)wb.Workbook={};wb.Workbook.Views=[{RTL:true}];XLSX.utils.book_append_sheet(wb,ws,'الطلاب');
    saveFile('قالب أسماء الطلاب.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}));
  },
  delst(b){if(!guard())return;confirm2(b,()=>{S.students=S.students.filter(s=>s.id!==b.dataset.s);saveStudents();render()})},
  addsub(){if(!guard())return;const i=$('#newsub'),n=i.value.trim();if(!n){i.focus();return}S.cfg.subjects.push({id:'m'+Date.now().toString(36),name:n.slice(0,40)});saveCfg();render()},
  delsub(b){if(!guard())return;confirm2(b,()=>{S.cfg.subjects.splice(Number(b.dataset.i),1);saveCfg();render()})},
  demo(b){if(!guard())return;confirm2(b,loadDemo)},
  wipe(b){if(!guard())return;confirm2(b,wipe)},
  async reload(){S.docs={};setSync('جارٍ التحديث…');try{await loadBase()}catch(e){toast('تعذّر التحديث')}setSync();render()}
};
const CH={
  subj(e){S.subj=e.value;render()},
  async restfile(e){
    const f=e.files&&e.files[0];if(!f)return;
    try{
      const o=JSON.parse(await f.text());if(!o||o.app!=='aylman'||!o.data||typeof o.data!=='object')throw 0;
      const data={};for(const [k,v] of Object.entries(o.data))if(/^(school|att|grades|timetable)\/[\w.\-:@+~]+$/.test(k)&&v&&typeof v==='object'&&!Array.isArray(v))data[k]=v;
      const st=data['school/students'];
      S.rest={file:f.name,date:String(o.date||'').slice(0,10),n:st&&Array.isArray(st.list)?st.list.length:0,data};render();
    }catch(err){toast('هذا الملف ليس نسخة احتياطية صالحة');e.value=''}
  },
  ttcell(e){if(!guard()){render();return}const [key,doc]=ttDoc();if(e.value)doc.g[e.dataset.k]=e.value;else delete doc.g[e.dataset.k];Store.set(key,doc)},
  ptime(e){if(!guard())return;if(!e.value){render();return}S.cfg.periods[Number(e.dataset.i)][e.dataset.k]=e.value;saveCfg()},
  async xfile(e){
    const f=e.files&&e.files[0];if(!f)return;
    if(!window.XLSX){toast('تعذّر تحميل قارئ Excel. تحقق من الاتصال');return}
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',blankrows:false});
      S.imp=parseRows(rows,f.name);
      if(!S.imp.rows.length&&!S.imp.dup){S.imp=null;toast('لم أجد أسماء في الملف. تأكد من عمود «الاسم»');e.value='';return}
      render();
    }catch(err){console.error(err);toast('تعذّرت قراءة الملف. استخدم ملف xlsx أو csv');e.value=''}
  },
  repstu(e){S.repStu=e.value;render()},
  mark(e){
    if(!guard()){render();return}
    const sid=e.dataset.s,j=Number(e.dataset.i),key=gKey(S.classId,S.term),g=S.docs[key]||(S.docs[key]={m:{}});
    let v=e.value.trim()===''?null:Number(e.value);
    if(v!=null){if(!isFinite(v))v=null;else{v=Math.min(MAX[j],Math.max(0,Math.round(v*2)/2));if(String(v)!==e.value){e.value=v;toast(`الدرجة بين 0 و${MAX[j]}`)}}}
    const m=g.m[sid]||(g.m[sid]={}),a=m[S.subj]||(m[S.subj]=[null,null,null]);a[j]=v;
    Store.set(key,g);const t=document.getElementById('tot-'+sid);if(t)t.textContent=f1(subjTotal(g,sid,S.subj));
  },
  stname(e){if(!guard())return;const s=S.students.find(x=>x.id===e.dataset.s);const n=e.value.trim();if(!s||!n){render();return}s.name=n.slice(0,80);saveStudents()},
  stclass(e){if(!guard())return;const s=S.students.find(x=>x.id===e.dataset.s);if(s){s.c=e.value;saveStudents();render()}},
  clsname(e){if(!guard())return;const n=e.value.trim();if(!n){render();return}S.cfg.classes[Number(e.dataset.i)].name=n.slice(0,40);saveCfg();render()},
  clsteacher(e){if(!guard())return;S.cfg.classes[Number(e.dataset.i)].teacher=e.value.trim().slice(0,60);saveCfg()},
  subname(e){if(!guard())return;const n=e.value.trim();if(!n){render();return}S.cfg.subjects[Number(e.dataset.i)].name=n.slice(0,40);saveCfg()},
  mapurl(e){if(!guard())return;const v=e.value.trim();
    if(v&&!okUrl(v)){toast('الرابط يجب أن يبدأ بـ https://');return}
    if(v)S.cfg.mapUrl=v.slice(0,500);else delete S.cfg.mapUrl;saveCfg();drawHead();toast(v?'أُرفق موقع المدرسة بالعنوان':'أُزيل رابط الموقع')},
  cfg(e){if(!guard())return;S.cfg[e.dataset.k]=e.value.trim().slice(0,120);saveCfg();drawHead()},
  termd(e){if(!guard())return;if(!e.value){render();return}S.cfg.terms[Number(e.dataset.i)][e.dataset.k]=e.value;saveCfg()}
};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(b&&!b.disabled&&ACT[b.dataset.act])ACT[b.dataset.act](b)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')$('#lightbox').hidden=true;if(ev.key==='Enter'&&ev.target.id==='pw')ACT.unlock();if(ev.key==='Enter'&&ev.target.id==='actcode')ACT.activate()});
document.addEventListener('change',ev=>{const e=ev.target.closest('[data-ch]');if(e&&CH[e.dataset.ch])CH[e.dataset.ch](e)});

/* ---------- الترخيص: نسخة تجريبية + رمز تفعيل ---------- */
const License={
  SALT:'LC-AYLMAN-2026',
  HASH:'a4347c27c295dcc6e88c1f0ec23ed71acd010a50a424b119d064255e423dc068',
  TRIAL_DAYS:3, DAY:86400000, _o:null,
  _read(){try{return JSON.parse(localStorage.getItem('aylman:lic')||'null')}catch(e){return null}},
  _write(o){try{localStorage.setItem('aylman:lic',JSON.stringify(o))}catch(e){}},
  tick(){let o=this._read();const now=Date.now();
    if(!o||typeof o!=='object')o={installed:now,seen:now,act:''};
    if(!o.installed)o.installed=now;
    o.seen=Math.max(Number(o.seen)||now,now);
    this._write(o);this._o=o;},
  activated(){const o=this._o||this._read();return !!(o&&o.act===this.HASH)},
  daysUsed(){const o=this._o||this._read();if(!o)return 0;return Math.floor(((o.seen||0)-(o.installed||0))/this.DAY)},
  daysLeft(){return Math.max(0,this.TRIAL_DAYS-this.daysUsed())},
  locked(){return !this.activated() && this.daysLeft()<=0},
  async verify(code){const h=await hashPw(String(code||'').trim(),this.SALT);
    if(h===this.HASH){const o=this._o||this._read()||{installed:Date.now(),seen:Date.now()};o.act=this.HASH;this._write(o);this._o=o;return true}
    return false;}
};
function drawCredit(){
  if(document.getElementById('lc-credit'))return;
  const d=document.createElement('div');d.id='lc-credit';
  d.style.cssText='text-align:center;color:var(--muted);font-size:.8rem;line-height:1.7;padding:16px 10px 22px';
  const trial=(!License.activated()&&!License.locked())?`<div style="color:var(--amber);font-weight:600;margin-bottom:4px">نسخة تجريبية — باقٍ ${License.daysLeft()} يوم</div>`:'';
  d.innerHTML=trial+'© Logical Code — جميع الحقوق محفوظة';
  document.body.appendChild(d);
}

/* ---------- البدء ---------- */
render();
(async()=>{
  await Store.init();
  try{await loadBase()}catch(e){console.error(e)}
  License.tick();
  S.mode=License.locked()?'trial_locked':(hasLock()?'locked':'ready');
  setSync();render();drawCredit();
})();
